rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Pushed over Anova's WebSocket; nothing polls.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: The protocol library (anova_api) ships inside the integration; it has no requirements beyond Home Assistant's.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Devices are reached through Anova's cloud, not discovered on the network.
  discovery:
    status: exempt
    comment: Devices are reached through Anova's cloud, not discovered on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The only setting is the account sign-in, which re-authentication covers; another account is another entry.
  repair-issues:
    status: exempt
    comment: The only issue needing the user is a revoked sign-in, which re-authentication handles.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
